version: "2"
linters:
  default: all
  disable:
    - cyclop
    - tagliatelle
    - testpackage
    - exhaustruct_v5
    - depguard
    - err113
    - gosec
    - goconst
    - funlen
    - gocognit
    - varnamelen
    - mnd
    - noinlineerr
    - wrapcheck
    - gomodguard
  settings:
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
  exclusions:
    generated: disable
    rules:
      - linters:
          - dupl
        path: _test.go
      - linters:
          - dupl
        path: internal/linter/rule/refvars
      - linters:
          - gofumpt
          - gci
          - modernize
          - nolintlint
          - perfsprint
        path: internal/linter/generated_config_rules.go
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines

